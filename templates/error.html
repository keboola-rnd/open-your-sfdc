{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}

{% block content %}
<div class="bg-white rounded shadow p-8 text-center">
    <div class="text-5xl font-bold text-slate-300">{{ code }}</div>
    <p class="mt-4 text-slate-600">{{ message }}</p>
    <a href="{{ url_for('sf.dashboard') }}" class="mt-6 inline-block bg-blue-600 text-white rounded px-4 py-2 text-sm">Back to dashboard</a>
</div>
{% endblock %}
